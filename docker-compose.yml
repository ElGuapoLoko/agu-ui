name: agu-tasks-web

# Production build of the Angular app, served by nginx (non-root) on http://localhost:4200.
# /api is proxied to the backend repository (agu-php), reachable as "agu-api" on the shared network.
services:
  frontend:
    build: .
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://agu-api:8080}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    networks:
      - shared

networks:
  # Created by `make up` in either repository if it does not exist yet.
  shared:
    name: agu-tasks-net
    external: true
