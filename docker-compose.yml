name: agu-tasks-web

services:
  frontend:
    build: .
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://agu-api:8080}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:8080"
    networks:
      - shared

networks:
  shared:
    name: agu-tasks-net
    external: true
